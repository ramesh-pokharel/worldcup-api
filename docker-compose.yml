services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: worldcup
      POSTGRES_USER: ${DB_USER:-worldcup}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-worldcup} -d worldcup"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local fake SMTP — keep for offline dev without a real email account.
  # To use it: set MAIL_HOST=mailhog, MAIL_PORT=1025, MAIL_SMTP_AUTH=false, MAIL_SMTP_STARTTLS=false
  # Then open http://localhost:8025 to read sent emails.
  #
  # For Gmail: MAIL_HOST=smtp.gmail.com MAIL_PORT=587 MAIL_SMTP_AUTH=true MAIL_SMTP_STARTTLS=true
  #            MAIL_USERNAME=you@gmail.com MAIL_PASSWORD=<app-password> MAIL_FROM=you@gmail.com
  # For Yahoo: MAIL_HOST=smtp.mail.yahoo.com (same port/auth settings as Gmail)
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/worldcup?user=${DB_USER:-worldcup}&password=${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRY_MS: ${JWT_ACCESS_EXPIRY_MS:-900000}
      JWT_REFRESH_EXPIRY_MS: ${JWT_REFRESH_EXPIRY_MS:-604800000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MAIL_HOST: ${MAIL_HOST:-mailhog}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-noreply@worldcup2026.local}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
