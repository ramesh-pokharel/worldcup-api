spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none              # Flyway owns the schema; JPA must not validate (ordering issue in Spring Boot 4)
    show-sql: false
    open-in-view: false           # avoid OSIV anti-pattern
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true   # Spring Boot built-in errors (405, 415, etc.) also return ProblemDetail
  jackson:
    default-property-inclusion: non_null
    property-naming-strategy: SNAKE_CASE   # camelCase fields → snake_case JSON
server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    secret: ${JWT_SECRET}
    access-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}       # 15 min
    refresh-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}  # 7 days
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  cookie:
    secure: ${COOKIE_SECURE:false}   # set true in production (HTTPS)
  mail:
    from: ${MAIL_FROM:noreply@worldcup2026.local}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    brevo-api-key: ${BREVO_API_KEY:}
